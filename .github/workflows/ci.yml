name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/test.js
      - run: node bin/joons-mcp-mock-server.js --version
      - run: node bin/joons-mcp-mock-server.js validate --snapshot examples/snapshot.json
      - run: node bin/joons-mcp-mock-server.js validate-fixtures --fixtures examples/fixtures.json --snapshot examples/snapshot.json
